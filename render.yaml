services:
  - type: web
    name: muasamcong-pro
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8080
      - key: REACT_FRONTEND_ENABLED
        value: "1"
      - key: MUASAMCONG_NO_BROWSER
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ALLOW_LOCAL_STORAGE
        value: "1"
      - key: AUTO_MIGRATE
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
